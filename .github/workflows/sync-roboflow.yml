name: Sync Epicollect photos to Roboflow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: baseline indexes existing photos; reconcile matches them; sync uploads new photos
        type: choice
        required: true
        default: baseline
        options: [baseline, reconcile, sync]
  schedule:
    - cron: '41 12 * * *'

permissions:
  contents: write

concurrency:
  group: roboflow-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'schedule' || vars.ROBOFLOW_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Roboflow client
        run: python -m pip install roboflow
      - name: Run sync
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          ROBOFLOW_WORKSPACE: ayma-rizwan-s-workspace
          ROBOFLOW_PROJECT: fungal-culture-morphology-2
          SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'sync' }}
        run: python scripts/sync_roboflow.py --mode "$SYNC_MODE"
      - name: Commit manifest
        run: |
          if git diff --quiet -- data/roboflow/manifest.csv; then
            echo "Manifest unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roboflow/manifest.csv
          git commit -m "Update Roboflow photo manifest"
          git push
